<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tune In · by Valourine</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #07080f;
    font-family: 'Palatino Linotype', Palatino, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 60px;
    position: relative;
    overflow-x: hidden;
  }
  .bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow1 {
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 45%;
    background: radial-gradient(ellipse 120% 80% at 50% 100%, rgba(200,80,20,0.22) 0%, rgba(180,60,10,0.12) 40%, transparent 70%);
  }
  .bg-glow2 {
    position: absolute;
    bottom: 0; left: 10%; right: 10%; height: 30%;
    background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(230,130,30,0.18) 0%, transparent 70%);
  }
  .bg-glow3 {
    position: absolute;
    bottom: 5%; left: -5%; width: 40%; height: 35%;
    background: radial-gradient(ellipse, rgba(200,80,60,0.1) 0%, transparent 70%);
    filter: blur(40px);
  }
  .bg-top {
    position: absolute;
    top: 0; left: 0; right: 0; height: 50%;
    background: radial-gradient(ellipse 100% 80% at 50% 0%, rgba(15,20,50,0.6) 0%, transparent 100%);
  }
  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 600px;
  }
  .header {
    text-align: center;
    margin-bottom: 52px;
  }
  .byline {
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(230,130,50,0.6);
    margin-bottom: 16px;
  }
  h1 {
    font-size: clamp(44px, 8vw, 68px);
    font-weight: 300;
    color: #f5ede0;
    letter-spacing: 8px;
    line-height: 1;
    margin-bottom: 6px;
  }
  .divider {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(230,130,50,0.7), transparent);
    margin: 16px auto;
  }
  .tagline {
    color: rgba(200,170,140,0.6);
    font-size: 13px;
    letter-spacing: 1.5px;
    font-style: italic;
  }
  .input-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(230,130,50,0.15);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 16px;
    transition: box-shadow 0.4s;
  }
  .input-card.focused {
    box-shadow: 0 0 40px rgba(230,100,30,0.12);
  }
  label {
    display: block;
    color: rgba(230,130,50,0.7);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(230,130,50,0.2);
    padding: 0 0 14px;
    font-size: 15px;
    color: #f0e0cc;
    font-family: 'Palatino Linotype', Palatino, serif;
    resize: none;
    outline: none;
    line-height: 1.7;
    caret-color: rgba(230,130,50,0.8);
  }
  textarea::placeholder { color: rgba(200,150,100,0.2); font-style: italic; }
  .btn-main {
    margin-top: 20px;
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, rgba(200,80,20,0.8) 0%, rgba(230,140,30,0.8) 100%);
    border: 1px solid rgba(230,140,30,0.4);
    border-radius: 10px;
    color: #fff8f0;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Palatino Linotype', Palatino, serif;
    box-shadow: 0 4px 24px rgba(200,80,20,0.3);
    transition: all 0.35s;
  }
  .btn-main:disabled {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(230,130,50,0.15);
    color: rgba(200,160,100,0.25);
    box-shadow: none;
    cursor: not-allowed;
  }
  .error {
    background: rgba(180,50,30,0.12);
    border: 1px solid rgba(180,50,30,0.2);
    border-radius: 10px;
    padding: 13px 18px;
    color: rgba(230,150,120,0.8);
    font-size: 13px;
    text-align: center;
    margin-bottom: 16px;
  }
  .results { display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 22px 24px;
    animation: riseIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
  }
  .card.anchor {
    border-color: rgba(230,130,50,0.35);
    box-shadow: 0 0 30px rgba(200,80,20,0.12);
  }
  .card-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
  }
  .card-icon { font-size: 13px; color: rgba(230,130,50,0.7); }
  .card-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: rgba(230,130,50,0.6); }
  .card-desc { font-size: 11px; color: rgba(200,160,120,0.3); font-style: italic; }
  .card-text { color: rgba(240,220,195,0.85); font-size: 15px; line-height: 1.75; font-weight: 300; }
  .card.anchor .card-text { color: #f5ddb8; font-size: 17px; font-style: italic; font-weight: 400; }
  .btn-reset {
    margin-top: 4px;
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px;
    padding: 11px;
    color: rgba(200,150,100,0.4);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Palatino Linotype', Palatino, serif;
  }
  .footer {
    text-align: center;
    margin-top: 56px;
    color: rgba(200,150,100,0.2);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="bg">
  <div class="bg-glow1"></div>
  <div class="bg-glow2"></div>
  <div class="bg-glow3"></div>
  <div class="bg-top"></div>
</div>

<div class="container">
  <div class="header">
    <div class="byline">by Valourine</div>
    <h1>TUNE IN</h1>
    <div class="divider"></div>
    <p class="tagline">return to centre.</p>
  </div>

  <div class="input-card" id="inputCard">
    <label>What noise are you carrying?</label>
    <textarea id="noiseInput" rows="4" placeholder="I'm anxious about money… I feel like I'm falling behind… I don't trust that it's going to work out…"></textarea>
    <button class="btn-main" id="tuneBtn" onclick="handleTune()">✦ Clear the Static</button>
  </div>

  <div class="error" id="errorBox" style="display:none"></div>
  <div class="results" id="results" style="display:none"></div>

  <div class="footer">Valourine · Return to Centre</div>
</div>

<script>
const SYSTEM_PROMPT = `You are the intuitive voice behind Valourine — a guide who helps people clear energetic noise and return to their Core Self and the natural Intuitive Energy Flow that is always available to them.

When someone shares a worry, fear, or noisy thought, your role is to gently help them tune their frequency back toward clarity, ease, and alignment with the Field — the intelligent, responsive energy that connects all things.

Use this framework and language consistently:
- "Noise" or "static" = the low-frequency thought patterns, fears, worries
- "The Field" = the intelligent universe/source energy that is always responding to their light
- "Intuitive Energy Flow" = their natural state of alignment (where their desires already exist vibrationally)
- "Core Self" = their inner being / higher self / deepest knowing
- "Tuning your frequency" = the act of pivoting toward better-feeling thoughts
- "Light" = their true energetic output when clear of noise — their Centre, their natural illuminated state
- "Static" = contrast showing them what they want by showing them what they don't want

Your response structure:
1. ACKNOWLEDGE the noise without judgment — validate the feeling as real information, not a failure (2-3 sentences)
2. REFRAME — what is this static actually pointing toward? What does it reveal about what they truly want? What is the Field reflecting back? (2-3 sentences)
3. PIVOT THOUGHT — a softer, more reachable thought. NOT toxic positivity. A genuine bridge. (2-3 sentences)
4. TUNING MANTRA — a short powerful phrase to anchor the new frequency. Poetic, embodied, theirs.

Tone: grounded, warm, quietly certain. Not preachy. Never use "Abraham," "Vortex," "Law of Attraction," "Esther Hicks," "Universe," or "signal" — use "the Field," "light," or "centre" instead.

Keep total response under 230 words.

Respond ONLY as a JSON object with these exact keys — no preamble, no markdown, no backticks:
{"acknowledgment":"...","reframe":"...","pivot":"...","mantra":"..."}`;

const cards = [
  { key: "acknowledgment", label: "Heard", icon: "◎", desc: "your noise, received" },
  { key: "reframe", label: "Centre", icon: "⟡", desc: "finding your way back" },
  { key: "pivot", label: "Shift", icon: "↑", desc: "a reachable thought" },
  { key: "mantra", label: "Anchor", icon: "✦", desc: "tune & hold", isAnchor: true },
];

const textarea = document.getElementById('noiseInput');
const inputCard = document.getElementById('inputCard');
textarea.addEventListener('focus', () => inputCard.classList.add('focused'));
textarea.addEventListener('blur', () => inputCard.classList.remove('focused'));

async function handleTune() {
  const noise = textarea.value.trim();
  if (!noise) return;

  const btn = document.getElementById('tuneBtn');
  const errorBox = document.getElementById('errorBox');
  const results = document.getElementById('results');

  btn.disabled = true;
  btn.textContent = 'tuning…';
  errorBox.style.display = 'none';
  results.style.display = 'none';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: noise }]
      })
    });

    const data = await response.json();
    const text = (data.content || []).map(i => i.text || '').join('');
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    results.innerHTML = '';
    cards.forEach((card, i) => {
      const div = document.createElement('div');
      div.className = 'card' + (card.isAnchor ? ' anchor' : '');
      div.style.animationDelay = (i * 0.12) + 's';
      div.innerHTML = `
        <div class="card-header">
          <span class="card-icon">${card.icon}</span>
          <span class="card-label">${card.label}</span>
          <span class="card-desc">${card.desc}</span>
        </div>
        <p class="card-text">${parsed[card.key]}</p>
      `;
      results.appendChild(div);
    });

    const resetBtn = document.createElement('button');
    resetBtn.className = 'btn-reset';
    resetBtn.textContent = '↩ return to centre';
    resetBtn.onclick = () => {
      results.style.display = 'none';
      textarea.value = '';
      btn.disabled = false;
      btn.textContent = '✦ Clear the Static';
    };
    results.appendChild(resetBtn);
    results.style.display = 'flex';

  } catch(e) {
    errorBox.textContent = 'Lost the centre. Breathe, then try again.';
    errorBox.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = '✦ Clear the Static';
}
</script>
</body>
</html>
